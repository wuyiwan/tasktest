#jdbc
server:
  port: 8081
spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:sqlite::resource:static/task
    driver-class-name: org.sqlite.JDBC
    username:
    password:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  type-aliases-package: com.example.demo.pojo
