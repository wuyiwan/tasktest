<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Details</title>
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #87CEEB 0%, #B0E0E6 50%, #ADD8E6 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 42px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        .header hr {
            width: 200px;
            height: 4px;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            border: none;
            margin: 20px auto;
            border-radius: 2px;
        }

        .detail-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }

        .detail-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #ecf0f1;
        }

        .detail-header h2 {
            color: #2c3e50;
            font-size: 28px;
            font-weight: 700;
        }

        .task-id {
            display: inline-block;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
        }

        .detail-section {
            margin-bottom: 25px;
        }

        .detail-label {
            color: #7f8c8d;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .detail-value {
            color: #2c3e50;
            font-size: 16px;
            line-height: 1.6;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .info-item {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 12px;
        }

        .level-high {
            background: linear-gradient(135deg, #e74c3c, #c0392b) !important;
            color: white;
        }

        .level-medium {
            background: linear-gradient(135deg, #f39c12, #d68910) !important;
            color: white;
        }

        .level-low {
            background: linear-gradient(135deg, #27ae60, #1e8449) !important;
            color: white;
        }

        .level-high .detail-label,
        .level-medium .detail-label,
        .level-low .detail-label {
            color: rgba(255, 255, 255, 0.8);
        }

        .level-high .detail-value,
        .level-medium .detail-value,
        .level-low .detail-value {
            color: white;
            font-weight: 600;
        }

        .description-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .image-section {
            margin-bottom: 25px;
        }

        .image-container {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .task-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .no-image {
            padding: 40px 20px;
            color: #95a5a6;
            font-size: 15px;
        }

        .btn-close {
            display: block;
            width: 100%;
            padding: 16px 30px;
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
            color: white;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            text-decoration: none;
            letter-spacing: 1px;
            margin-top: 20px;
        }

        .btn-close:hover {
            background: linear-gradient(135deg, #7f8c8d, #6c7a7b);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .btn-close:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Task Details</h1>
            <hr>
        </div>

        <div class="detail-card">
            <div class="detail-header">
                <h2 th:text="${user.description}">Task Title</h2>
                <span class="task-id" th:text="'ID: ' + ${user.id}">ID: 001</span>
            </div>

            <div class="info-grid">
                <div class="info-item" th:class="'info-item ' + (${user.level} != null ? 'level-' + ${user.level.toLowerCase()} : '')">
                    <div class="detail-label">Priority Level</div>
                    <div class="detail-value" th:text="${user.level}">Medium</div>
                </div>
                <div class="info-item">
                    <div class="detail-label">Date</div>
                    <div class="detail-value" th:text="${user.date}">2024-01-15</div>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="detail-label">Person in Charge</div>
                    <div class="detail-value" th:text="${user.pic}">John Doe</div>
                </div>
                <div class="info-item">
                    <div class="detail-label">Status</div>
                    <div class="detail-value">Active</div>
                </div>
            </div>

            <div class="image-section" th:if="${user.imagePath != null and #strings.length(user.imagePath) > 0}">
                <div class="detail-label">Task Image</div>
                <div class="image-container">
                    <img class="task-image" th:src="@{'/images/' + ${user.imagePath}}" alt="Task Image">
                </div>
            </div>

            <div class="detail-section" th:if="${user.taskDescription != null and #strings.length(user.taskDescription) > 0}">
                <div class="detail-label">Task Description</div>
                <div class="description-section">
                    <div class="detail-value" th:text="${user.taskDescription}">
                        Detailed task description will appear here...
                    </div>
                </div>
            </div>

            <a href="/users" class="btn-close">Close</a>
        </div>
    </div>
</body>
</html>
